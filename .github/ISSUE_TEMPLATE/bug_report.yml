name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for the report. Please fill in every field; audio problems are hard to reproduce without details.
  - type: input
    id: version
    attributes:
      label: Voxwright version
      description: Shown in Settings > About.
      placeholder: 0.1.1
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - macOS 15
        - macOS 14
        - macOS 13
        - macOS 12
        - Other
    validations:
      required: true
  - type: textarea
    id: devices
    attributes:
      label: Audio devices
      description: Microphone, headphones, virtual cable (VB-CABLE, BlackHole, other), sample rates, and the buffer size from Settings > Audio.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Select voice ...
        2. Turn on Hear myself ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected and what happened
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log excerpt
      description: Settings > Advanced > Open logs folder. Paste the relevant lines.
      render: text
