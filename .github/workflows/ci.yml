name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: "6.8.3"
  AQT_VERSION: "3.3.0"
  QT_MODULES: "qtmultimedia qtspeech qtshadertools"
  # Same commit as builtin-baseline in vcpkg.json.
  VCPKG_COMMIT: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VCPKG_DISABLE_METRICS: "1"

jobs:
  hygiene-and-format:
    name: Hygiene and format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Repository hygiene
        run: python3 tools/hygiene/check_hygiene.py
      - name: Install clang-format 18
        run: sudo apt-get update && sudo apt-get install -y clang-format-18
      - name: clang-format
        run: tools/ci/check-format.sh

  linux:
    name: Linux ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [release, clang, asan, tsan]
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang-18 clang-tidy-18 \
            libgl1-mesa-dev libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-shape0 libfontconfig1 libdbus-1-3 libasound2t64 libpulse0 \
            libflite1 xvfb
      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-linux-${{ matrix.preset }}-${{ hashFiles('vcpkg.json', 'ports/**') }}
          restore-keys: vcpkg-linux-
      - name: vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" checkout "$VCPKG_COMMIT"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
      - name: Cache Qt
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/Qt
          key: qt-linux-${{ env.QT_VERSION }}-${{ env.QT_MODULES }}
      - name: Qt
        run: |
          if [ ! -d "$RUNNER_TEMP/Qt/$QT_VERSION/gcc_64" ]; then
            pip install "aqtinstall==$AQT_VERSION"
            aqt install-qt linux desktop "$QT_VERSION" linux_gcc_64 -m $QT_MODULES --outputdir "$RUNNER_TEMP/Qt"
          fi
          echo "QT_ROOT_DIR=$RUNNER_TEMP/Qt/$QT_VERSION/gcc_64" >> "$GITHUB_ENV"
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}
      - name: clang-tidy
        if: matrix.preset == 'clang'
        run: tools/ci/run-tidy.sh build/clang

  windows:
    name: Windows MSVC
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ${{ env.LOCALAPPDATA }}\vcpkg\archives
          key: vcpkg-windows-${{ hashFiles('vcpkg.json', 'ports/**') }}
          restore-keys: vcpkg-windows-
      - name: vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP\vcpkg"
          git -C "$env:RUNNER_TEMP\vcpkg" checkout $env:VCPKG_COMMIT
          & "$env:RUNNER_TEMP\vcpkg\bootstrap-vcpkg.bat" -disableMetrics
          "VCPKG_ROOT=$env:RUNNER_TEMP\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Qt
        shell: pwsh
        run: |
          pip install "aqtinstall==$env:AQT_VERSION"
          aqt install-qt windows desktop $env:QT_VERSION win64_msvc2022_64 -m $env:QT_MODULES.Split(' ') --outputdir "$env:RUNNER_TEMP\Qt"
          "QT_ROOT_DIR=$env:RUNNER_TEMP\Qt\$env:QT_VERSION\msvc2022_64" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Configure
        run: cmake --preset windows
      - name: Build
        run: cmake --build --preset windows
      - name: Test
        run: ctest --preset windows

  macos:
    name: macOS ${{ matrix.preset }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        preset: [macos, macos-asan]
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: brew install ninja
      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-macos-${{ matrix.preset }}-${{ hashFiles('vcpkg.json', 'ports/**') }}
          restore-keys: vcpkg-macos-
      - name: vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" checkout "$VCPKG_COMMIT"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
      - name: Qt
        run: |
          python3 -m pip install --break-system-packages "aqtinstall==$AQT_VERSION"
          python3 -m aqt install-qt mac desktop "$QT_VERSION" clang_64 -m $QT_MODULES --outputdir "$RUNNER_TEMP/Qt"
          echo "QT_ROOT_DIR=$RUNNER_TEMP/Qt/$QT_VERSION/macos" >> "$GITHUB_ENV"
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}
